name: CI
on:
  push:
  pull_request:
  schedule:
    - cron: '0 8 1 * *'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SECRET_KEY_BASE: ci-only-isolated-test-environment-secret-key-base-not-used-for-deployment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build pinned runtime
        run: docker compose build app
      - name: Run tests and application checks
        run: docker compose run --rm app bin/check
      - name: Audit dependencies
        run: docker compose run --rm app bundle-audit check --update
      - name: Static security analysis
        run: docker compose run --rm app brakeman --no-pager --exit-on-warn --exit-on-error
      - name: Show service logs
        if: failure()
        run: docker compose logs
      - name: Stop services
        if: always()
        run: docker compose down
