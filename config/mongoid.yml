development:
  clients:
    default:
      uri: <%= ENV.fetch('MONGODB_URI', 'mongodb://127.0.0.1:27017/labadee_api_development') %>

test:
  clients:
    default:
      uri: <%= ENV.fetch('MONGODB_TEST_URI', 'mongodb://127.0.0.1:27017/labadee_api_test') %>
      options:
        max_pool_size: 1

production:
  clients:
    default:
      uri: <%= ENV['MONGODB_URI'] %>
