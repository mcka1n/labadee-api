services:
  app:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.upgrade
      args:
        RUBY_VERSION: ${UPGRADE_RUBY_VERSION:-2.5.5}
        BUNDLER_VERSION: ${UPGRADE_BUNDLER_VERSION:-1.17.3}
    environment:
      MONGODB_URI: mongodb://mongo:27017/labadee_upgrade_development
      MONGODB_TEST_URI: mongodb://mongo:27017/labadee_upgrade_test
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-local-upgrade-only-not-for-deployment}
      DISABLE_SPRING: "1"
    volumes:
      - .:/app
      - upgrade_gems:/usr/local/bundle
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      mongo:
        condition: service_healthy
  mongo:
    platform: linux/amd64
    image: mongo:${UPGRADE_MONGO_VERSION:-4.4.29}
    volumes:
      - upgrade_mongo:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  upgrade_mongo:
    name: labadee-upgrade-mongo-${UPGRADE_MONGO_VERSION:-4.4.29}
  upgrade_gems:
    name: labadee-upgrade-gems-${UPGRADE_RUBY_VERSION:-2.5.5}
